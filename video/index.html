<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1222'/%3E%3Cpath d='M9 10 L3 16 L9 22 M23 10 L29 16 L23 22' stroke='%237aa2ff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%2338d9c9'/%3E%3C/svg%3E">
<title>How lit-html renders</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b16; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; display: none; gap: 12px;
         align-items: center; font: 13px/1.2 system-ui, sans-serif; color: #ddd;
         background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  body.live #hud { display: flex; transition: opacity .4s ease; }
  body.live.quiet #hud { opacity: 0; }
  body.live.quiet { cursor: none; }
  #hud button, #hud select { font: inherit; color: #0c1222; background: #dfe6ff; border: 0; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  #hud input[type=range] { flex: 1; }
  #hud .t { font-variant-numeric: tabular-nums; min-width: 7ch; }
  #start { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  body.live.idle #start { display: flex; }
  #start button { font: 600 22px/1 system-ui, sans-serif; padding: 18px 28px; border-radius: 8px; border: 0;
                  background: #dfe6ff; color: #0c1222; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="start"><button id="play0">▶ Play with sound</button></div>
<div id="hud">
  <button id="play">Play</button>
  <span class="t" id="time">0:00.0</span>
  <input id="seek" type="range" min="0" max="1" step="0.01" value="0">
  <select id="scene"></select>
  <span id="fps"></span>
</div>
<script>
  // Under tools/render.mjs (?job=...), any uncaught error ends the job at
  // once. This is a classic script so it runs even when a module fails to load.
  (() => {
    const job = new URLSearchParams(location.search).get("job");
    if (!job) return;
    const fail = (msg) => fetch(`fail?job=${encodeURIComponent(job)}`, { method: "POST", body: String(msg) });
    addEventListener("error", (e) => fail(e.message ? `${e.message} @ ${e.filename}:${e.lineno}` : `failed to load ${e.target?.src ?? e.target}`), true);
    addEventListener("unhandledrejection", (e) => fail(`unhandled: ${e.reason?.stack ?? e.reason}`));
  })();
</script>
<script type="module" src="video/src/main.js"></script>
</body>
</html>
